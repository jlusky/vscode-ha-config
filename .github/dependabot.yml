version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
    open-pull-requests-limit: 10
    target-branch: dev
    groups:
      # The typescript-eslint packages are released together and peer-depend on
      # matching versions, so a bump of one alone fails npm ci with ERESOLVE.
      typescript-eslint:
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"
    ignore:
      # "typescript" is an alias for @typescript/typescript6, the TS 6 API that
      # typescript-eslint and ts-node load; TS 7 has no JS API. tsc itself is TS 7,
      # installed as "@typescript/native". Never let Dependabot replace the alias with typescript 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Stay on Node 24.x type definitions; ignore @types/node 25+
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
      # Must match engines.vscode (^1.101.0); vsce refuses to package newer API types.
      # Raise both together when the minimum VS Code version goes up.
      - dependency-name: "@types/vscode"
        versions: [">=1.102.0"]
  - package-ecosystem: npm
    directory: "/src/language-service"
    schedule:
      interval: daily
      time: "04:00"
    open-pull-requests-limit: 10
    target-branch: dev
    ignore:
      # Same TS 6 API alias as the root (see above)
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Keep in sync with the root @types/node version (Node 24.x)
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
    open-pull-requests-limit: 10
    target-branch: dev
