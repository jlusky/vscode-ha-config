name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  # Left out of the draft and of the version. Dependabot PRs are released by the Dependency
  # release workflow, which writes its own notes.
  - type: "pre-exclude"
    when:
      labels:
        - "invalid"
        - "wontfix"
        - "dependencies"

  # Sections of the release notes
  - title: "🚨 Breaking Changes"
    when:
      labels:
        - "breaking-change"
  - title: "🚀 Features"
    when:
      labels:
        - "feature"
        - "enhancement"
  - title: "🐛 Bug Fixes"
    when:
      labels:
        - "fix"
        - "bugfix"
        - "bug"
  - title: "🧬 YAML Schema Updates"
    when:
      labels:
        - "schema"
        - "yaml"
  - title: "📚 Documentation"
    when:
      labels:
        - "documentation"
  - title: "🧰 Maintenance"
    when:
      labels:
        - "chore"

  # The next version: the highest increment any change matches wins, and a release with no
  # major or minor change is a patch release
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels:
        - "major"
        - "breaking-change"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels:
        - "minor"
        - "feature"
        - "enhancement"
  - type: "version-resolver"
    semver-increment: "patch"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
template: |
  ## What’s Changed

  $CHANGES
