name: VS Code Extension

# Push runs only for the long-lived branches; feature branches are tested once,
# through their pull request, instead of once for the push and again for the PR.
on:
  push:
    branches: [dev, master]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress; runs on dev/master always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Publishing uses VSCE_TOKEN / OPEN_VSX_TOKEN; GITHUB_TOKEN only needs to read the repo
permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    strategy:
      # Let the other OS finish when one fails, to tell flaky from platform-specific failures
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7

      - name: 🏗 Set up NodeJS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/language-service/package-lock.json

      - name: 🏗 Install NodeJS packages
        run: npm ci

      - name: 🚀 Run Linter
        run: npm run lint

      - name: 🚀 Build Schema
        run: npm run schema

      # npm test compiles first, so there is no separate compile step
      - name: 🧪 Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: 🧪 Run tests (macOS)
        if: runner.os == 'macOS'
        run: npm test

  publish:
    name: Publish Extension
    needs: ci
    if: success() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7

      - name: 🏗 Set up NodeJS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: 🏗 Install NodeJS packages
        run: npm ci

      - name: 🚀 Run Linter
        run: npm run lint

      - name: 🚀 Build Schema
        run: npm run schema

      - name: 🚀 Run Compile
        run: npm run compile

      - name: 🚀 VSCode Marketplace Publish
        run: |
          npm install -g @vscode/vsce
          vsce publish -p $VSCE_TOKEN
          vsce package -o vscode-ha-config.vsix
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

      - name: 🚀 Open VSX Publish
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: vscode-ha-config.vsix
          registryUrl: https://open-vsx.org
