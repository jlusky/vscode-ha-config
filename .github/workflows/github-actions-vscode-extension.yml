name: VS Code Extension

# Push runs only for dev; feature branches are tested once, through their pull request,
# instead of once for the push and again for the PR. Publishing a GitHub release builds,
# tests and then publishes that version to the VS Code Marketplace and Open VSX.
on:
  push:
    branches: [dev]
    paths-ignore: ["**.md"]
  # No path filter here: the "Extension result" job must report on every PR so it can be a
  # required check. The changes job below skips the build for docs-only PRs instead.
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress. Other runs (dev pushes, releases,
# manual runs) each get their own group, so a queued run is never replaced by a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GITHUB_TOKEN only needs to read the repo; the publish job adds what it needs
permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: 🔍 Check for changes other than Markdown
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Include both sides of a rename, so moving a file out of scope still counts
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          # The API lists at most 3000 files; if the list may be cut short, don't skip
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only Markdown changed; skipping build and tests"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      # Let the other OS finish when one fails, to tell flaky from platform-specific failures
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Set up NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/language-service/package-lock.json

      - name: 🏗 Install NodeJS packages
        run: npm ci

      - name: 🚀 Run Linter
        run: npm run lint

      - name: 🚀 Build Schema
        run: npm run schema

      # npm test compiles first, so there is no separate compile step
      - name: 🧪 Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: 🧪 Run tests (macOS)
        if: runner.os == 'macOS'
        run: npm test

  # The single required check for branch protection. It always runs, and passes only if
  # every job it depends on succeeded or was skipped (docs-only PR).
  result:
    name: Extension result
    if: always()
    needs: [changes, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ✅ Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required job did not succeed"; exit 1 ;;
            esac
          done

  # Runs when a GitHub release is published (normally the Release Drafter draft), after the
  # build and tests pass. The version comes from the release tag, so package.json's version
  # is not bumped by hand. Pre-releases are not published.
  #
  # Building and publishing are separate jobs: npm ci runs dependencies' install scripts, so
  # it runs here, in a job that can't request an OIDC token. The publish job gets only the
  # finished .vsix and never runs install scripts.
  package:
    name: Package Extension
    needs: result
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Set up NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/language-service/package-lock.json

      - name: 🏷 Set version from the release tag
        run: |
          # Only vX.Y.Z: "1.2.3" and "v1.2.3" would publish the same version from two releases
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: 🏗 Install NodeJS packages
        run: npm ci

      - name: 🚀 Build Schema
        run: npm run schema

      - name: 🚀 Run Compile
        run: npm run compile

      # vscode:prepublish bundles dist/ with esbuild; node_modules isn't shipped
      - name: 📦 Package
        run: npx vsce package --no-dependencies -o vscode-ha-config.vsix

      - name: ⤴️ Upload the .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: vscode-ha-config.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Extension
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Attach the .vsix to the release
      contents: write
      # Trusted Publishing for both the Marketplace (vsce) and Open VSX (ovsx): each
      # exchanges GitHub's OIDC token for a short-lived credential, so there are no
      # publishing secrets
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Set up NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # vsce and ovsx come from the lockfile. --ignore-scripts keeps every dependency's
      # install script from running in this job, which can request an OIDC token.
      - name: 🏗 Install the publishing tools
        run: npm ci --ignore-scripts

      - name: ⤵️ Download the .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: 🚀 VS Code Marketplace Publish
        # A rerun after a failed release upload must not fail on the already-published version
        # Needs a Trusted Publishing policy for this repository and workflow on the publisher
        run: npx vsce publish --oidc --packagePath vscode-ha-config.vsix --skip-duplicate

      - name: 🚀 Open VSX Publish
        # Publishes the same .vsix to open-vsx.org under the "blown" namespace (the publisher
        # in package.json). Trusted Publishing: ovsx exchanges GitHub's OIDC token for a
        # short-lived Open VSX token, so there is no publishing secret.
        # Needs a trusted publisher for this repository and workflow on the namespace
        run: npx ovsx publish --trusted-publishing --packagePath vscode-ha-config.vsix --skip-duplicate

      - name: 📎 Attach the .vsix to the release
        run: gh release upload "$TAG" vscode-ha-config.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
