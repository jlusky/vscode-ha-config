name: VS Code Extension

# Push runs only for the long-lived branches; feature branches are tested once,
# through their pull request, instead of once for the push and again for the PR.
on:
  push:
    branches: [dev, master]
    paths-ignore: ["**.md"]
  # No path filter here: the "Extension result" job must report on every PR so it can be a
  # required check. The changes job below skips the build for docs-only PRs instead.
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress. Other runs (dev/master pushes,
# manual runs) each get their own group, so a queued run is never replaced by a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Publishing uses VSCE_TOKEN / OPEN_VSX_TOKEN; GITHUB_TOKEN only needs to read the repo
permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: 🔍 Check for changes other than Markdown
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Include both sides of a rename, so moving a file out of scope still counts
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          # The API lists at most 3000 files; if the list may be cut short, don't skip
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only Markdown changed; skipping build and tests"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      # Let the other OS finish when one fails, to tell flaky from platform-specific failures
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7

      - name: 🏗 Set up NodeJS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/language-service/package-lock.json

      - name: 🏗 Install NodeJS packages
        run: npm ci

      - name: 🚀 Run Linter
        run: npm run lint

      - name: 🚀 Build Schema
        run: npm run schema

      # npm test compiles first, so there is no separate compile step
      - name: 🧪 Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: 🧪 Run tests (macOS)
        if: runner.os == 'macOS'
        run: npm test

  # The single required check for branch protection. It always runs, and passes only if
  # every job it depends on succeeded or was skipped (docs-only PR).
  result:
    name: Extension result
    if: always()
    needs: [changes, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ✅ Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required job did not succeed"; exit 1 ;;
            esac
          done

  publish:
    name: Publish Extension
    needs: ci
    if: success() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7

      - name: 🏗 Set up NodeJS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: 🏗 Install NodeJS packages
        run: npm ci

      - name: 🚀 Run Linter
        run: npm run lint

      - name: 🚀 Build Schema
        run: npm run schema

      - name: 🚀 Run Compile
        run: npm run compile

      - name: 🚀 VSCode Marketplace Publish
        run: |
          npm install -g @vscode/vsce
          vsce publish -p $VSCE_TOKEN
          vsce package -o vscode-ha-config.vsix
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

      - name: 🚀 Open VSX Publish
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: vscode-ha-config.vsix
          registryUrl: https://open-vsx.org
