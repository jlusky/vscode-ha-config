name: Release Drafter

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev

permissions:
  # Create and update the draft release
  contents: write
  # Read merged pull requests to build the release notes
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
