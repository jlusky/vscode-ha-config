name: Dependency release

# Every Monday, releases the Dependabot updates merged since the last release as a patch
# version. It releases only when every change since the last release came from a Dependabot
# PR: if any other change is unreleased, it does nothing, so features still go out in a
# release you publish yourself with your own notes.
#
# A release published with GITHUB_TOKEN doesn't trigger the "release" event, so this starts
# the VS Code Extension workflow itself, which builds, tests and publishes that tag.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be released"
        type: boolean
        default: true

# One release at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# GITHUB_TOKEN only needs to read the repo; the job adds what it needs
permissions:
  contents: read

jobs:
  release:
    name: Release dependency updates
    if: github.repository == 'jlusky/vscode-ha-config'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Create the tag and release
      contents: write
      # Read which PR each commit came from
      pull-requests: read
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # A scheduled run has no inputs, so it always releases
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - name: 🔍 Find the changes since the last release
        id: changes
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          if ! [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::The latest release tag must look like v1.2.3, got '$latest'"
            exit 1
          fi
          next="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"

          # Release exactly this commit, even if dev moves on while the workflow runs
          sha=$(gh api "repos/$REPO/commits/dev" --jq .sha)
          commits=$(gh api "repos/$REPO/compare/$latest...$sha" --paginate --jq '.commits[].sha')
          if [ -z "$commits" ]; then
            echo "Nothing has changed since $latest."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every commit must belong to a merged Dependabot PR. A commit with no PR, or from
          # anyone else's PR, means the release is left for you.
          prs=""
          for commit in $commits; do
            pr=$(gh api "repos/$REPO/commits/$commit/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "dev")] | first // empty | "\(.number) \(.user.login)"')
            if [ -z "$pr" ]; then
              echo "::notice::$commit isn't from a merged PR, so there's no dependency release this time. Publish the next release yourself."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            read -r number author <<< "$pr"
            if [ "$author" != "dependabot[bot]" ]; then
              echo "::notice::#$number by $author isn't released yet, so there's no dependency release this time. Publish the next release yourself."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            prs="$prs $number"
          done
          prs=$(printf '%s\n' $prs | sort -nu)

          {
            echo "## What’s Changed"
            echo
            echo "## ⬆️ Dependencies"
            echo
            for number in $prs; do
              gh api "repos/$REPO/pulls/$number" --jq '"- \(.title) @\(.user.login | rtrimstr("[bot]")) (#\(.number))"'
            done
          } > notes.md

          echo "Releasing $next from $sha with:"
          cat notes.md
          {
            echo "release=true"
            echo "tag=$next"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: 🏷 Publish the release
        id: publish
        if: steps.changes.outputs.release == 'true' && env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.changes.outputs.tag }}
          SHA: ${{ steps.changes.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::$TAG is already released"
            exit 1
          fi

          # The tag may already exist without a release (pushed by hand, or left by a deleted
          # release). Publishing would then release whatever commit it points to, not $SHA.
          if ref=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2> ref-error.txt); then
            read -r type tagged <<< "$ref"
            # An annotated tag points to a tag object; follow it to the commit
            if [ "$type" = "tag" ]; then
              tagged=$(gh api "repos/$REPO/git/tags/$tagged" --jq .object.sha)
            fi
            if [ "$tagged" != "$SHA" ]; then
              echo "::error::The tag $TAG already exists on $tagged, not $SHA. Delete it or release it by hand."
              exit 1
            fi
          elif ! grep -q "HTTP 404" ref-error.txt; then
            cat ref-error.txt
            echo "::error::Couldn't check whether the tag $TAG exists"
            exit 1
          fi

          # Release Drafter keeps one draft for the next release, named like v1.2.3, with the
          # template's heading. It leaves Dependabot PRs out, so when only they are unreleased
          # it lists no changes: publish it with these notes instead of leaving a second release
          # for the same version. It makes a new draft on the next push to dev. Any other draft
          # is left alone.
          draft=$(gh api "repos/$REPO/releases" --paginate \
            --jq '.[] | select(.draft and ((.name // "") | test("^v[0-9]+[.][0-9]+[.][0-9]+$")) and ((.body // "") | startswith("## What’s Changed"))) | .id' | head -n 1)
          if [ -n "$draft" ]; then
            gh api -X PATCH "repos/$REPO/releases/$draft" \
              -f tag_name="$TAG" -f target_commitish="$SHA" -f name="$TAG" \
              -f body="$(cat notes.md)" -F draft=false -f make_latest=true > /dev/null
          else
            gh release create "$TAG" --repo "$REPO" --target "$SHA" --title "$TAG" \
              --notes-file notes.md --latest
          fi
          echo "Published $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # A separate job, so if starting the build fails after the release is published, "Re-run
  # failed jobs" retries it with the same tag. A new run wouldn't: it finds nothing unreleased.
  # To publish a tag by hand, run the VS Code Extension workflow from the tag with release_tag.
  publish:
    name: Build, test and publish the extension
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Start the VS Code Extension workflow
      actions: write
    steps:
      - name: 🚀 Start the VS Code Extension workflow for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run github-actions-vscode-extension.yml --repo "$REPO" --ref "$TAG" -f release_tag="$TAG"
