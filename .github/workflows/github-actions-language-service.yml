name: Language Service

# Push runs only for the long-lived branches; feature branches are tested once,
# through their pull request, instead of once for the push and again for the PR.
on:
  push:
    branches: [dev, master]
    paths:
      - "src/language-service/**"
      - ".github/**"
  pull_request:
    paths:
      - "src/language-service/**"
      - ".github/**"
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress; runs on dev/master always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Publishing uses NPM_TOKEN; GITHUB_TOKEN only needs to read the repo
permissions:
  contents: read

jobs:
  language-service:
    name: Language Service
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7

      - name: 🏗 Set up NodeJS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/language-service/package-lock.json

      - name: 🏗 Install NodeJS packages
        working-directory: src/language-service
        run: npm ci

      - name: 🚀 Run Linter
        working-directory: src/language-service
        run: npm run lint

      - name: 🚀 Build Schema
        working-directory: src/language-service
        run: npm run schema

      - name: 🚀 Run Compile
        working-directory: src/language-service
        run: npm run compile

      - name: 🏗 Create .npmrc
        if: success() && github.ref == 'refs/heads/master'
        run:
          echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🚀 Publish to NPM Registry
        if: success() && github.ref == 'refs/heads/master'
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish src/language-service

    # - name: NPM Publish to Registry
