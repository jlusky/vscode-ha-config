name: Language Service

# Push runs only for the long-lived branches; feature branches are tested once,
# through their pull request, instead of once for the push and again for the PR.
on:
  push:
    branches: [dev, master]
    paths:
      - "src/language-service/**"
      - ".github/**"
  # No path filter here: the "Language Service result" job must report on every PR so it can
  # be a required check. The changes job below skips the build when nothing relevant changed.
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress. Other runs (dev/master pushes,
# manual runs) each get their own group, so a queued run is never replaced by a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Publishing uses NPM_TOKEN; GITHUB_TOKEN only needs to read the repo
permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: 🔍 Check for language service or workflow changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Include both sides of a rename, so moving a file out of scope still counts
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          # The API lists at most 3000 files; if the list may be cut short, don't skip
          if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(src/language-service/|\.github/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "No language service or workflow changes; skipping build"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  language-service:
    name: Language Service
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7

      - name: 🏗 Set up NodeJS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/language-service/package-lock.json

      - name: 🏗 Install NodeJS packages
        working-directory: src/language-service
        run: npm ci

      - name: 🚀 Run Linter
        working-directory: src/language-service
        run: npm run lint

      - name: 🚀 Build Schema
        working-directory: src/language-service
        run: npm run schema

      - name: 🚀 Run Compile
        working-directory: src/language-service
        run: npm run compile

      - name: 🏗 Create .npmrc
        if: success() && github.ref == 'refs/heads/master'
        run:
          echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🚀 Publish to NPM Registry
        if: success() && github.ref == 'refs/heads/master'
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish src/language-service

    # - name: NPM Publish to Registry
    #   uses: actions/npm@master
    #   if: success() && github.ref == 'refs/heads/master'
    #   env:
    #     NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    #   with:
    #     args: publish src/language-service

  # The single required check for branch protection. It always runs, and passes only if
  # every job it depends on succeeded or was skipped (no relevant changes).
  result:
    name: Language Service result
    if: always()
    needs: [changes, language-service]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ✅ Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required job did not succeed"; exit 1 ;;
            esac
          done
